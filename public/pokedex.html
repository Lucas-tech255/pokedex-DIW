<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Pokédex</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./pokedex.css">
</head>

<body>
    <div class="pokedex">
        <header class="pokedex-cabecalho">
            <div class="painel-luzes" aria-hidden="true">
                <span class="sensor"></span>

                <div class="luzes">
                    <span class="luz luz-vermelha"></span>
                    <span class="luz luz-amarela"></span>
                    <span class="luz luz-verde"></span>
                </div>
            </div>

            <div class="marca">
                <h1>Pokédex</h1>
                <span>REGIÃO DE KANTO</span>
            </div>
        </header>

        <div class="moldura">
            <div class="visor">
                <header class="visor-cabecalho">
                    <span class="indicador" aria-hidden="true"></span>
                    <span>CATÁLOGO POKÉMON</span>
                    <span class="versao">GEN 01</span>
                </header>

                <main class="visor-conteudo">
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-md-8">
                            <label for="pesquisa" class="form-label">
                                Pesquisar por nome
                            </label>

                            <input type="search" id="pesquisa" class="form-control" placeholder="Ex.: Pikachu">
                        </div>

                        <div class="col-12 col-md-4">
                            <label for="filtro-tipo" class="form-label">
                                Filtrar por tipo
                            </label>

                            <select id="filtro-tipo" class="form-select">
                                <option value="">Todos os tipos</option>
                            </select>
                        </div>
                    </div>

                    <p id="contador" aria-live="polite">
                        Carregando Pokémon...
                    </p>

                    <div id="lista-pokemon" class="row g-3"></div>
                </main>
            </div>

            <div class="moldura-base" aria-hidden="true">
                <span class="botao-vermelho"></span>
                <div class="alto-falante">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <footer class="pokedex-rodape">
            <div class="controles-decorativos" aria-hidden="true">
                <span class="botao-escuro"></span>
                <span class="botao-barra"></span>
                <span class="direcional"></span>
            </div>

            <p>POKÉDEX • KANTO 151</p>
        </footer>
    </div>

    <dialog id="detalhes-pokemon" class="ficha">
        <div class="ficha-cabecalho">
            <span>REGISTRO POKÉMON</span>

            <button type="button" id="fechar-detalhes" class="btn btn-outline-light btn-sm"
                aria-label="Fechar detalhes">
                Fechar ✕
            </button>
        </div>

        <div id="conteudo-detalhes" class="ficha-conteudo"></div>
    </dialog>
    <script src="./pokedex.js"></script>
</body>

</html>
